<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Car image placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161310"/>
      <stop offset="100%" stop-color="#0c0a08"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="640" height="280" fill="url(#bg)"/>

  <!-- Neutral three-box car silhouette: deliberately generic, not modelled on
       any specific manufacturer, so it can never contradict the card title. -->
  <g transform="translate(70,74)">
    <path d="M14 96
             C 8 96 2 91 2 84
             L 2 68
             C 2 60 8 54 16 52
             L 76 40
             L 132 8
             C 140 3 150 0 160 0
             L 300 0
             C 314 0 327 5 337 15
             L 372 44
             L 452 56
             C 470 59 482 73 482 90
             L 482 96
             C 482 100 478 104 474 104
             L 14 104
             Z"
          fill="url(#body)" stroke="#fbbf24" stroke-opacity="0.42" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- glasshouse -->
    <path d="M150 16 L292 16 C302 16 311 20 318 27 L344 46 L142 46 Z"
          fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.26" stroke-width="2"/>
    <line x1="232" y1="16" x2="232" y2="46" stroke="#fbbf24" stroke-opacity="0.26" stroke-width="2"/>
    <!-- wheels -->
    <circle cx="132" cy="104" r="30" fill="#0c0a08" stroke="#fbbf24" stroke-opacity="0.42" stroke-width="2.5"/>
    <circle cx="132" cy="104" r="12" fill="none" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="386" cy="104" r="30" fill="#0c0a08" stroke="#fbbf24" stroke-opacity="0.42" stroke-width="2.5"/>
    <circle cx="386" cy="104" r="12" fill="none" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="2"/>
  </g>

  <text x="320" y="248" text-anchor="middle"
        font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" letter-spacing="0.14em"
        fill="#f5f1ea" fill-opacity="0.38">LIVE MARKET SEARCH</text>
</svg>
